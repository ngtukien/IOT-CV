# SonarCloud — chay o che do Automatic Analysis (khong co job rieng trong ci.yml).
sonar.projectKey=ngtukien_IOT-CV
sonar.organization=ngtukien

# ---------------------------------------------------------------------------
# Loai khoi phan tich: code da NGHI HUU, giu lai chi de doi chieu.
#
# docs/archive/        : README ke hoach 92 giai doan, so tay HTML cu, va 9 file
#                        frontend JS thuan bi React thay the o Phase 08-10.
# firmware/dronebridge/legacy-sketch/
#                      : sketch nhap 39 dong, bi DroneBridge for ESP32 thay the
#                        o Phase 12.
# firmware/ardupilot/build-d450a747/
#                      : san pham build tu custom.ardupilot.org, khong phai code
#                        cua du an.
#
# Vi sao can khai bao: `git mv` doi duong dan, nen Sonar coi chung la "code moi"
# cua PR va tinh vao New Code quality gate — du khong ai sua mot dong nao ben
# trong. Loai chung ra la de gate do khi code DANG SONG hong, chu khong phai de
# lam nhe con so.
# ---------------------------------------------------------------------------
sonar.exclusions=docs/archive/**,firmware/dronebridge/legacy-sketch/**,firmware/ardupilot/build-d450a747/**,frontend/dist/**,ml/datasets/**,ml/weights/**,ml/results/**

# Component do shadcn sinh tu registry, khong phai code viet tay.
sonar.cpd.exclusions=frontend/src/components/ui/**
