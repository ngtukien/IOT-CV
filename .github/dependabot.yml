version: 2
updates:
  # Phụ thuộc Python. Sau Phase 01 nguồn phụ thuộc là pyproject.toml + uv.lock ở gốc
  # và ml/pyproject.toml, không còn requirements*.txt.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    # opencv-python ghim <5 có chủ đích (xem plans/reports/260921-research-web-gcs-stack.md).
    # albumentations ghim ==2.0.8 vì bản sau đổi sang giấy phép AGPL.
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: "/ml"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # torch cài bằng --index-url cu130, dependabot không biết chỉ mục đó.
      - dependency-name: "torch"
      - dependency-name: "torchvision"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
