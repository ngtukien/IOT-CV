version: 2
updates:
  # Phụ thuộc Python. Sau Phase 01 nguồn phụ thuộc là pyproject.toml + uv.lock ở gốc
  # và ml/pyproject.toml, không còn requirements*.txt.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    # opencv-python ghim <5 có chủ đích (xem plans/reports/260921-research-web-gcs-stack.md).
    # albumentations chặn nhảy major/minor: 2.0.0 (08/01/2025) là bản phá vỡ API — xoá
    # always_apply và get_params_dependent_on_targets, đổi ngữ nghĩa tham số GaussNoise.
    # Kiểm chứng trên PyPI 21/09/2026: 2.0.8 là bản mới nhất và vẫn là MIT.
    # Lần chú thích trước ghi "bản sau đổi sang AGPL" -- đó là thông tin sai, đã bỏ.
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: "/ml"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # torch cài bằng --index-url cu130, dependabot không biết chỉ mục đó.
      - dependency-name: "torch"
      - dependency-name: "torchvision"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
