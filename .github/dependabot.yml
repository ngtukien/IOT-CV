version: 2
updates:
  # Phụ thuộc Python. Sau Phase 01 nguồn phụ thuộc là pyproject.toml + uv.lock ở gốc
  # và ml/pyproject.toml, không còn requirements*.txt.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    groups:
      # Gom tất cả thành MỘT pull request. Không gom thì dependabot mở một PR, chờ merge,
      # rồi mở PR tiếp theo -- với chục gói thì thành chục vòng review cho cùng một việc.
      python:
        patterns: ["*"]
    # opencv-python ghim <5 có chủ đích (xem plans/reports/260921-research-web-gcs-stack.md).
    # albumentations dừng ở 2.0.8 và đó là bản CUỐI của gói này, không phải tạm thời.
    # Kiểm chứng PyPI 21/09/2026: albumentations 2.0.8 (MIT) phát hành 27/05/2025, không có
    # bản nào sau. Bản kế nhiệm là gói KHÁC TÊN, albumentationsx 2.4.10, license_expression
    # AGPL-3.0-only, vẫn ra bản mới (14/09/2026). Chặn major/minor để bot không kéo dự án
    # qua ranh giới giấy phép đó. Xem plans/ai/ai-phase-04-bao-cao-xla.md dòng 276.
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: "/ml"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    groups:
      # Gom tất cả thành MỘT pull request. Không gom thì dependabot mở một PR, chờ merge,
      # rồi mở PR tiếp theo -- với chục gói thì thành chục vòng review cho cùng một việc.
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      - dependency-name: "albumentations"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # torch cài bằng --index-url cu130, dependabot không biết chỉ mục đó.
      - dependency-name: "torch"
      - dependency-name: "torchvision"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - "type/chore"
    groups:
      actions:
        patterns: ["*"]
