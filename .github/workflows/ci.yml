name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI chỉ đọc source, không cần quyền ghi vào repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # Chi cai core + dev. ML stack (torch/ultralytics) khong can cho unit test.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest
        # Repo mới setup có thể chưa có test — không fail CI vì lý do đó.
        run: |
          if [ -d backend/tests ]; then
            pytest
          else
            echo "Chưa có backend/tests — bỏ qua bước test."
          fi
