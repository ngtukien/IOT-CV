name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI chỉ đọc source, không cần quyền ghi vào repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# KHÔNG thêm `paths:` filter vào workflow này. Ba job dưới đây là required check;
# GitHub báo một required check bị bỏ qua vì `paths` là "Expected — Waiting"
# VĨNH VIỄN, tức là PR không bao giờ merge được nữa.
#
# `timeout-minutes` bắt buộc ở mọi job: mặc định của GitHub là 6 GIỜ.
#
# Chỉ chạy Python 3.13 — `requires-python` trong pyproject.toml đã khoá
# ">=3.13,<3.14", nên ma trận 3.11/3.12 cũ vừa thừa vừa mâu thuẫn.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra dev
      # Job này KHÔNG build frontend, nên `frontend/dist` vắng mặt và
      # `test_frontend_duoc_serve` tự skip (pytest.mark.skipif). Đó là chủ đích,
      # không phải test bị bỏ quên: Phase 10 kiểm chứng thật bằng Playwright.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
