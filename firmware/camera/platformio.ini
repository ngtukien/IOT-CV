; Firmware camera IOT-CV — bo ESP32-S3 N16R8 + module OV3660 (plans/phase-12 §12.3).
; Nap: firmware/camera/README.md. Build: pio run -e esp32s3_n16r8
[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32
framework = arduino
monitor_speed = 115200
; ESP32-S3 N16R8: flash 16 MB che do QIO + PSRAM 8 MB che do OCTAL (OPI).
; Banner PlatformIO van in ten bo goc "DevKitC-1-N8 (No PSRAM)" - binh thuong; firmware.map
; dung sdk esp32s3/qio_opi la PSRAM octal da co hieu luc.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Bang chan ESP32S3_EYE da kiem tren bo that 13/10/2026: esp_camera_init OK, PID 0x3660.
; Bo co cong USB-UART rieng (CH343P) nen Serial ra thang cong do -> KHONG them
; -DARDUINO_USB_CDC_ON_BOOT=1.
build_flags =
    -DCAMERA_MODEL_ESP32S3_EYE
    -DBOARD_HAS_PSRAM
