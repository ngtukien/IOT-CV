<header class="top">

  <div class="ttl"><b>Lắp ráp drone S500 — hướng dẫn tương tác</b><span id="metaLine"></span></div>
  <div class="grow"></div>

    <div class="search-res" id="qres"></div>
  </div>
  <button class="icon-btn" id="btnPrint" title="In checklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
  <button class="icon-btn" id="btnTheme" title="Sáng / tối"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
</header>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="lb" id="lb">
  <div class="lb-bar"><b id="lbTitle"></b><span class="grow"></span><button data-z="in">＋</button><button data-z="out">－</button><button data-z="fit">Vừa khung</button><button data-z="close">Đóng ✕</button></div>
  <div class="lb-stage" id="lbStage"><div class="lb-inner" id="lbInner"></div></div>
</div>
