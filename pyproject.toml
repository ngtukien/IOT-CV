[project]
name = "iot-cv"
version = "0.1.0"
description = "UAV IoT + Computer Vision - web GCS va pipeline AI"
# Hai lop ghim Python, moi lop mot viec: `.python-version` (uv doc, da commit)
# CHON dung ban; dong duoi day CHAN khi ai do chay nham ban khac.
requires-python = ">=3.13,<3.14"
# San phien ban lay theo BAN CAO NHAT giua plan va requirements*.txt cu (dependabot
# PR #21 da bump len). Ha san xuong so trong plan se cho phep giai ra ban cu hon
# ban CI tung kiem — do la hoi quy, khong phai don dep.
dependencies = [
    "pymavlink>=2.4.49",
    "fastapi>=0.141.1",
    # Khai bao TUONG MINH du fastapi cung keo pydantic ve: backend/schemas.py
    # import thang `pydantic` va goi `models_json_schema`. Dua vao dependency
    # gian tiep nghia la mot ban fastapi sau nay doi backend la ta gay.
    "pydantic>=2.12",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "paho-mqtt>=2.1",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.8",
    # Phase 07 §7.10.2: coverage >= 80% cho safety + mission + deadman + proximity.
    "pytest-cov>=7.0",
    # Cùng lý do với nhóm `vision` bên dưới: test của nguồn video giả cần cv2.
    "opencv-python-headless>=4.12",
]
# Khối vision tách riêng khỏi dependency chính: backend BAY (MAVLink, WebSocket)
# phải chạy được trên máy không cài OpenCV — SAFETY.md mục 9, mất camera không
# được kéo telemetry chết theo. Bản "headless" vì backend không mở cửa sổ nào.
vision = [
    "opencv-python-headless>=4.12",
]

# Day la ung dung, khong phai thu vien de publish -> uv khong can build no.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# ardupilot/ là source firmware upstream 2 GB — tuyệt đối không lint vào đó.
extend-exclude = ["ardupilot", "logs", "ml/datasets", "ml/weights", ".venv", "venv-ardupilot"]
# ruff >= 0.16 format ca khoi ```python TRONG file Markdown. Voi repo nay do la
# hai nhieu hon loi: cac doan trong plans/ va docs/ la VI DU MINH HOA cho nguoi
# doc, khong phai ma nguon — khong ai chay, khong ai import chung. Ruff muon
# bung chung thanh danh sach doc dai loe ngoe, lam tai lieu kho doc hon ma
# khong bat duoc bat ky loi nao. Loai ra la bo tieng on, khong phai tat den bao.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
