[tool.ruff]
line-length = 100
target-version = "py313"
# ardupilot/ là source firmware upstream 2 GB — tuyệt đối không lint vào đó.
extend-exclude = ["ardupilot", "logs", "ml/datasets", "ml/weights", ".venv", "venv-ardupilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
